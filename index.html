<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>程式學習筆記：Python 與 Java</title>
<style>
:root{--bg:#fff;--panel:#f1f3f5;--text:#1f2328;--muted:#656d76;--line:#d8dee4;--py:#306998;--jv:#e76f00;--accent:var(--py);--code:#f6f8fa;--out:#e8f5e9;--outt:#1b5e20;--tip:#fff8e1;--tipl:#f9a825;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--panel:#1d2227;--text:#e6e8ea;--muted:#9aa4ad;--line:#30363d;--py:#5b9bd5;--jv:#ff9a3c;--code:#0e1114;--out:#16301b;--outt:#9be5a4;--tip:#2b2410;--tipl:#d9a21b}}
:root[data-theme="dark"]{--bg:#14171a;--panel:#1d2227;--text:#e6e8ea;--muted:#9aa4ad;--line:#30363d;--py:#5b9bd5;--jv:#ff9a3c;--code:#0e1114;--out:#16301b;--outt:#9be5a4;--tip:#2b2410;--tipl:#d9a21b}
html{scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
.logo{font-weight:700;font-size:18px;margin-right:8px;white-space:nowrap}
.tab{border:0;padding:7px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;background:transparent;color:var(--muted)}
.tab.on[data-l="py"]{background:var(--py);color:#fff}.tab.on[data-l="jv"]{background:var(--jv);color:#fff}.tab.on[data-l="vs"]{background:#007acc;color:#fff}
#q{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:150px;font:inherit;font-size:14px}
#theme,#menu{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer}
#menu{display:none}
.wrap{display:flex;max-width:1200px;margin:0 auto}
nav{width:250px;flex:none;padding:16px;border-right:1px solid var(--line);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
nav h4{margin:0 0 8px;color:var(--muted);font-size:13px;letter-spacing:.05em}
nav a{display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:15px;line-height:1.5}
nav a:hover{background:var(--panel)}nav a.on{background:var(--accent);color:#fff}
main{flex:1;min-width:0;padding:24px 32px 60px}
h1{margin:0 0 4px;font-size:30px;border-left:6px solid var(--accent);padding-left:12px}
.crumb{color:var(--muted);font-size:14px;margin-bottom:20px}
h3{margin-top:28px}
code{background:var(--code);padding:1px 6px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.ex{margin:14px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);font-size:13px;color:var(--muted)}
.ex button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:5px;padding:2px 10px;cursor:pointer;font-size:12px}
pre{margin:0;padding:14px;background:var(--code);overflow-x:auto;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace}
.out{padding:10px 14px;background:var(--out);color:var(--outt);font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;border-top:1px solid var(--line)}
.tip{background:var(--tip);border-left:5px solid var(--tipl);padding:10px 14px;border-radius:4px;margin:16px 0}
.exq{margin-top:36px;padding:16px;border:2px dashed var(--accent);border-radius:8px}.exq h3{margin:0 0 8px}.exq summary{cursor:pointer;font-weight:600;color:var(--accent);margin:10px 0}.exq .ex{margin:8px 0 0}
.my{margin-top:28px}.my textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;resize:vertical}.done{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.qz{margin-top:28px}.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}.opt:hover:not(:disabled){background:var(--panel)}.opt.ok{background:var(--out);border-color:#2e7d32}.opt.no{background:#fdecea;border-color:#c62828;color:#7f1d1d}.fb{margin-top:6px;font-size:14px;color:var(--muted)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.pn a{padding:10px 18px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-weight:600}
@media(max-width:800px){#menu{display:block}nav{display:none;position:fixed;top:56px;left:0;bottom:0;width:80%;background:var(--bg);z-index:6;height:auto}nav.open{display:block}main{padding:20px 16px 50px}#q{width:100px}.logo{display:none}}
@media(max-width:800px){.tab{padding:6px 9px;font-size:14px}#q{width:80px}}
.fig{margin:16px 0;text-align:center}.fig svg{max-width:100%;height:auto}.fig figcaption{font-size:13px;color:var(--muted);margin-top:4px}.fig rect{fill:var(--panel);stroke:var(--line)}.fig svg text{fill:var(--text);font-size:14px}.fig svg .b{fill:#007acc;stroke:none}.fig svg .c{fill:#007acc;stroke:none}.fig svg .d{fill:#fff;stroke:none}.fig svg .w{fill:#fff}.fig svg .k{fill:#007acc}.fig path{stroke:var(--muted);fill:none;stroke-width:2}
</style>
</head>
<body>
<header>
<button id="menu">☰</button><span class="logo">📘 程式學習筆記</span>
<button class="tab" data-l="vs">VS Code</button><button class="tab" data-l="py">Python</button><button class="tab" data-l="jv">Java</button>

<script>
// 內容格式：['p',文字] ['h',小標] ['code',程式碼,輸出] ['tip',提示]
const L={vs:[
{id:'vs-install',t:'安裝與認識 VS Code',b:[['p','Visual Studio Code（簡稱 VS Code）是微軟推出的免費程式編輯器，支援 Windows、macOS、Linux。用同一套工具就能寫 Python、Java 與其他語言，是目前最多人使用的入門選擇。'],['h','下載與安裝'],['p','到官方網站 <code>code.visualstudio.com</code> 下載對應系統的安裝檔。Windows 安裝時建議勾選「加入 PATH」與「以 Code 開啟」選項；macOS 把程式拖進「應用程式」資料夾即可。'],['h','認識介面'],['svg','<svg viewBox="0 0 640 330"><rect x="2" y="2" width="636" height="326" rx="8"/><text x="200" y="21">hello.py - MyProject - Visual Studio Code</text><rect x="10" y="32" width="40" height="252"/><rect x="50" y="32" width="130" height="252"/><text x="60" y="56">檔案總管</text><text x="60" y="80">MyProject</text><text x="72" y="102">hello.py</text><rect x="180" y="32" width="448" height="170"/><text x="195" y="60">x = 1 + 1</text><text x="195" y="84">print(x)</text><rect x="180" y="202" width="448" height="82"/><text x="195" y="228">$ python hello.py</text><text x="195" y="250">2</text><rect class="b" x="2" y="290" width="636" height="36"/><text class="w" x="14" y="313">Python 3.x    UTF-8    Ln 1, Col 1</text><circle class="c" cx="30" cy="160" r="12"/><text class="w" x="26" y="165">1</text><circle class="c" cx="115" cy="160" r="12"/><text class="w" x="111" y="165">2</text><circle class="c" cx="400" cy="120" r="12"/><text class="w" x="396" y="125">3</text><circle class="c" cx="400" cy="262" r="12"/><text class="w" x="396" y="267">4</text><circle class="d" cx="600" cy="308" r="12"/><text class="k" x="596" y="313">5</text></svg>','示意圖：① 活動列　② 側邊欄（檔案總管）　③ 編輯區　④ 終端機　⑤ 狀態列'],['p','<b>活動列</b>（最左側）：檔案總管、搜尋、原始檔控制、執行與偵錯、擴充功能。<br><b>側邊欄</b>：顯示目前活動列對應的內容。<br><b>編輯區</b>：中間寫程式的地方，可分割成多個視窗。<br><b>終端機</b>：下方，可直接執行指令。<br><b>狀態列</b>（最下方）：顯示語言、直譯器、錯誤與警告數量。'],['h','正確開啟專案'],['p','請使用「檔案 → 開啟資料夾」，把一個資料夾當成一個專案來開啟，而不是只開單一檔案。這樣終端機、執行與外掛功能才會正常。'],['tip','想要中文介面：到擴充功能搜尋 <code>Chinese (Traditional) Language Pack</code> 安裝，重新啟動即可。']]},
{id:'vs-pyinst',t:'圖解：安裝 Python',b:[['p','開始前先確認電腦是否已安裝：開啟終端機輸入 <code>python --version</code>，若顯示版本號就不用重裝。以下圖解僅為示意，實際畫面會依版本略有不同。'],['svg','<svg viewBox="0 0 640 120"><rect x="5" y="20" width="190" height="80" rx="8"/><text x="25" y="55">① 下載安裝檔</text><text x="25" y="78">python.org/downloads</text><rect x="225" y="20" width="190" height="80" rx="8"/><text x="245" y="55">② 安裝並勾選 PATH</text><text x="245" y="78">Add python.exe to PATH</text><rect x="445" y="20" width="190" height="80" rx="8"/><text x="465" y="55">③ 驗證</text><text x="465" y="78">python --version</text><path d="M195 60 H222 M216 54 L222 60 L216 66"/><path d="M415 60 H442 M436 54 L442 60 L436 66"/></svg>','安裝 Python 三步驟'],['h','Windows'],['p','1. 開啟 <code>python.org/downloads</code>，點選黃色的「Download Python 3.x」。<br>2. 執行下載的安裝檔。<br>3. 第一個畫面<b>先勾選下方的「Add python.exe to PATH」</b>，再按「Install Now」。<br>4. 看到安裝成功的畫面後按「Close」。<br>5. 開啟「命令提示字元」，或 VS Code 的終端機，輸入 <code>python --version</code> 驗證。'],['svg','<svg viewBox="0 0 520 200"><rect x="5" y="5" width="510" height="190" rx="8"/><text x="25" y="35">Install Python 3.x (64-bit)</text><rect class="b" x="25" y="50" width="200" height="38" rx="6"/><text class="w" x="72" y="74">Install Now</text><text x="45" y="125">☑ Use admin privileges when installing py.exe</text><rect x="25" y="138" width="470" height="34" rx="6" style="stroke:#e53935;stroke-width:3;fill:none"/><text x="45" y="160">☑ Add python.exe to PATH</text><text x="330" y="160" style="fill:#e53935;font-weight:700">← 一定要勾選</text></svg>','Windows 安裝畫面示意（請務必勾選 Add python.exe to PATH）'],['tip','若輸入 python 後跳出 Microsoft Store，代表 Python 尚未安裝或 PATH 沒設定。請重新安裝並勾選 PATH；或到「設定 → 應用程式 → 進階應用程式設定 → 應用程式執行別名」，關閉 python.exe 的別名。'],['h','macOS'],['p','<b>方法 A（最簡單）</b>：到 <code>python.org/downloads</code> 下載 macOS 安裝檔（.pkg），開啟後一路按「繼續」。<br><b>方法 B</b>：已安裝 Homebrew 的人，可在終端機輸入：'],['code','brew install python\npython3 --version','Python 3.x.x'],['p','macOS 請使用 <code>python3</code> 與 <code>pip3</code> 指令。'],['h','Linux（Ubuntu / Debian）'],['code','sudo apt update\nsudo apt install python3 python3-pip python3-venv\npython3 --version','Python 3.x.x']]},
{id:'vs-py',t:'在 VS Code 設定並執行 Python',b:[['p','要在 VS Code 寫 Python，需要兩樣東西：<b>Python 直譯器</b>（真正執行程式）與 <b>Python 擴充功能</b>（讓編輯器看懂 Python）。'],['h','步驟 1：安裝 Python'],['p','到 <code>python.org/downloads</code> 下載最新穩定版。<b>Windows 安裝第一個畫面務必勾選「Add python.exe to PATH」</b>。macOS 也可用 Homebrew：<code>brew install python</code>。'],['h','步驟 2：確認安裝成功（在終端機輸入）'],['code','python --version\n# Windows 若無效可改用：py --version\n# macOS / Linux 通常用：python3 --version','Python 3.x.x'],['h','步驟 3：安裝擴充功能並選擇直譯器'],['p','在擴充功能搜尋並安裝微軟出的 <code>Python</code>（會一併安裝 Pylance）。接著按 <code>Ctrl+Shift+P</code>，輸入 <code>Python: Select Interpreter</code>，選擇剛安裝的版本。'],['h','步驟 4：寫第一支程式並執行'],['code','# hello.py\nprint("Hello, VS Code!")','Hello, VS Code!'],['p','執行方式有兩種：按編輯器右上角的 ▶「Run Python File」，或在終端機輸入 <code>python hello.py</code>。'],['h','建議：使用虛擬環境'],['code','python -m venv .venv\n# Windows 啟用：\n.venv\\\\Scripts\\\\activate\n# macOS / Linux 啟用：\nsource .venv/bin/activate\npip install requests','（啟用後終端機前面會出現 (.venv)）'],['tip','若出現「python 不是內部或外部命令」，代表 PATH 沒設好：重新安裝並勾選 Add to PATH，或改用 <code>py</code> 指令。']]},
{id:'vs-jvinst',t:'圖解：安裝 JDK',b:[['p','Java 開發一定要裝 <b>JDK</b>。JRE 只能「執行」Java 程式，JDK 才包含編譯器 <code>javac</code>。以下圖解僅為示意，實際畫面會依版本略有不同。'],['svg','<svg viewBox="0 0 640 120"><rect x="5" y="20" width="190" height="80" rx="8"/><text x="25" y="55">① 下載 JDK</text><text x="25" y="78">adoptium.net（LTS）</text><rect x="225" y="20" width="190" height="80" rx="8"/><text x="245" y="55">② 安裝並設定</text><text x="245" y="78">JAVA_HOME + PATH</text><rect x="445" y="20" width="190" height="80" rx="8"/><text x="465" y="55">③ 驗證</text><text x="465" y="78">javac -version</text><path d="M195 60 H222 M216 54 L222 60 L216 66"/><path d="M415 60 H442 M436 54 L442 60 L436 66"/></svg>','安裝 JDK 三步驟'],['h','Windows'],['p','1. 開啟 <code>adoptium.net</code>，選擇 Temurin 的 LTS 版本，作業系統選 Windows，下載 .msi 安裝檔。<br>2. 執行安裝，進入「Custom Setup」畫面時，把 <b>Add to PATH</b> 與 <b>Set JAVA_HOME variable</b> 都設為「Will be installed on local hard drive」。<br>3. 安裝完成後，<b>關閉所有舊的終端機與 VS Code，再重新開啟</b>。<br>4. 輸入 <code>java -version</code> 與 <code>javac -version</code> 驗證。'],['tip','環境變數只在「新開啟」的終端機才會生效。安裝完卻看不到新版本，通常只是忘了重開。'],['h','手動設定 JAVA_HOME（安裝時沒勾選才需要）'],['p','搜尋「編輯系統環境變數」→「環境變數」，新增系統變數 <code>JAVA_HOME</code>，再編輯 <code>Path</code> 加入一行：'],['code','JAVA_HOME = C:\\Program Files\\Eclipse Adoptium\\jdk-21.x.x-hotspot\nPath 新增   = %JAVA_HOME%\\bin','（路徑請依實際安裝的資料夾調整）'],['h','macOS'],['code','brew install --cask temurin\njava -version\n\n# 設定 JAVA_HOME（加入 ~/.zshrc）\nexport JAVA_HOME=$(/usr/libexec/java_home)','openjdk version "21.x.x" ...'],['p','也可以直接從 <code>adoptium.net</code> 下載 .pkg 安裝檔。'],['h','Linux（Ubuntu / Debian）'],['code','sudo apt update\nsudo apt install openjdk-21-jdk\njavac -version','javac 21.x.x'],['tip','需要在同一台電腦切換多個 Java 版本，可以使用 SDKMAN 管理（<code>sdk install java</code>）。']]},
{id:'vs-java',t:'在 VS Code 設定並執行 Java',b:[['p','要在 VS Code 寫 Java，需要 <b>JDK</b>（Java 開發工具包，含編譯器 javac）與微軟的 <b>Extension Pack for Java</b>。注意：只裝 JRE 不夠，一定要裝 JDK。'],['h','步驟 1：安裝 JDK'],['p','建議安裝最新的 LTS（長期支援）版本（例如 Java 21 或更新），可到 <code>adoptium.net</code> 下載免費的 Eclipse Temurin。安裝時若有「Set JAVA_HOME」選項請勾選。'],['h','步驟 2：確認安裝成功'],['code','java -version\njavac -version','openjdk version "21.x.x" ...\njavac 21.x.x'],['h','步驟 3：安裝擴充功能'],['p','在擴充功能搜尋 <code>Extension Pack for Java</code> 並安裝，它包含語言支援、偵錯、測試與 Maven 等工具。'],['h','步驟 4：建立專案並執行'],['p','按 <code>Ctrl+Shift+P</code>，輸入 <code>Java: Create Java Project</code>，選擇 <b>No build tools</b>，再指定資料夾與專案名稱。建立後在 <code>src</code> 內寫程式。'],['code','public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, Java!");\n    }\n}','Hello, Java!'],['p','按 main 方法上方的 <code>Run</code> 或右上角 ▶ 即可執行。也可以用終端機手動編譯與執行：'],['code','javac Main.java\njava Main','Hello, Java!'],['tip','若出現找不到 javac，代表 JDK 沒裝好或 PATH、JAVA_HOME 未設定。新版 Java 也支援單檔直接執行：<code>java Main.java</code>。']]},
{id:'vs-ext',t:'常用擴充功能',b:[['p','擴充功能是 VS Code 強大的原因。點左側「擴充功能」圖示（<code>Ctrl+Shift+X</code>）搜尋即可安裝。'],['code','Python (Microsoft)         Python 必備，含執行與偵錯\nPylance                    Python 智慧提示與型別檢查\nExtension Pack for Java    Java 必備套件包\nError Lens                 把錯誤直接顯示在該行旁邊\nMaterial Icon Theme        檔案圖示，一眼看出檔案類型\nGitLens                    查看程式碼是誰改的\nLive Share                 即時共同編輯，適合遠端教學\nCode Runner                一鍵快速執行（初學建議先用終端機）\nChinese (Traditional) Language Pack   繁體中文介面'],['tip','擴充功能不是越多越好，太多會拖慢速度。教學時建議只裝需要的，確保每位學生的環境一致。']]},
{id:'vs-keys',t:'常用快捷鍵',b:[['p','學會快捷鍵能大幅提升效率。以下是 Windows / Linux 的寫法，macOS 請把 <code>Ctrl</code> 換成 <code>Cmd</code>、<code>Alt</code> 換成 <code>Option</code>。'],['code','Ctrl+Shift+P    命令面板（最重要，什麼都能搜）\nCtrl+P          快速開啟檔案\nCtrl+`          開關終端機\nCtrl+B          開關側邊欄\nCtrl+/          註解或取消註解\nAlt+↑ / ↓      上下移動該行\nShift+Alt+↓    向下複製該行\nCtrl+D          選取下一個相同的字\nCtrl+F / Ctrl+H 搜尋 / 取代\nF2              重新命名變數（全專案同步修改）\nF12             跳到函式或類別的定義\nShift+Alt+F     格式化程式碼\nCtrl + 加號/減號 放大 / 縮小介面'],['tip','上課投影時很實用：<code>Ctrl</code> 加 <code>+</code> 可以把畫面放大，讓後排學生也看得清楚。']]},
{id:'vs-set',t:'常用設定',b:[['p','開啟設定：<code>Ctrl+,</code>。想直接編輯設定檔，按 <code>Ctrl+Shift+P</code> 輸入 <code>Preferences: Open User Settings (JSON)</code>。'],['code','{\n  "files.autoSave": "afterDelay",\n  "editor.fontSize": 16,\n  "editor.tabSize": 4,\n  "editor.formatOnSave": true,\n  "editor.wordWrap": "on"\n}','（自動存檔、字體 16、縮排 4 格、存檔時自動格式化、自動換行）'],['p','從這些設定宣告開始：<b>自動存檔</b>讓你不再忘記按存檔而結果沒更新；<b>縮排 4 格</b>符合 Python 的慣例；<b>存檔格式化</b>能保持程式碼整齊。'],['tip','想要在不同電腦使用相同設定，可用 VS Code 的 <code>Settings Sync</code>（設定同步），登入 GitHub 或 Microsoft 帳號即可。']]},
{id:'vs-debug',t:'執行與偵錯',b:[['p','偵錯（Debug）讓你讓程式「慢動作」執行，觀察每一步變數的變化，比用 print 找錯更有效率。Python 與 Java 的操作方式幾乎一樣。'],['h','基本操作'],['p','1. 在行號左邊點一下，設定紅色中斷點。<br>2. 按 <code>F5</code> 開始偵錯，程式會停在中斷點。<br>3. 左側「變數」面板可看到目前所有變數的值。<br>4. 用下列按鍵一步一步執行：'],['code','F5            開始 \/ 繼續執行\nF10           逐詞執行（Step Over，不進入函式）\nF11           進入函式（Step Into）\nShift+F11     跳出函式（Step Out）\nShift+F5      停止偵錯'],['h','練習：用偵錯找出問題'],['code','def avg(nums):\n    total = 0\n    for n in nums:\n        total += n\n    return total / len(nums)\n\nprint(avg([]))','ZeroDivisionError: division by zero'],['p','請在 <code>total / len(nums)</code> 這一行設中斷點，按 F5，觀察變數面板中的 <code>nums</code> 為空串列，就能找到錯誤原因。修正方式：在計算前先判斷 <code>if not nums</code>。'],['tip','「條件中斷點」：在中斷點上按右鍵→新增條件中斷點，只有符合條件（例如 <code>n == 99</code>）才停下，適合迴圈很多次的情況。']]},
{id:'vs-trouble',t:'環境常見問題排除',b:[['p','環境問題幾乎都能在這裡找到解法。'],['h','python 不是內部或外部命令'],['p','PATH 沒設定。重新安裝 Python 並勾選「Add python.exe to PATH」，安裝後重開終端機；Windows 也可以試試 <code>py --version</code>。'],['h','輸入 python 跳出 Microsoft Store'],['p','到「應用程式執行別名」關閉 python.exe，或先安裝 Python 後再試。'],['h','VS Code 找不到直譯器，或外掛安裝後沒反應'],['p','按 <code>Ctrl+Shift+P</code> 執行 <code>Python: Select Interpreter</code> 重新選擇；外掛剛裝完沒反應時，執行 <code>Developer: Reload Window</code>。'],['h','javac 不是內部或外部命令'],['p','代表只裝了 JRE，或 PATH／JAVA_HOME 沒設定。確認安裝的是 JDK，並關掉所有終端機後重新開啟。'],['h','啟用虛擬環境被 PowerShell 擋下（Windows）'],['code','Set-ExecutionPolicy -Scope CurrentUser RemoteSigned','（輸入後選 Y，再重新啟用虛擬環境）'],['h','專案路徑含中文或空白'],['p','部分工具遇到中文或空白的路徑會出錯。建議把專案放在全英文、沒有空白的資料夾。'],['h','macOS 顯示「無法開啟，因為來自未識別的開發者」'],['p','到「系統設定 → 隱私權與安全性」，找到被阻擋的項目，點選「仍要開啟」。'],['tip','求助時請附上：作業系統、執行的指令與完整錯誤訊息。把錯誤訊息貼到搜尋引擎或問 AI，通常能很快找到答案。']]}
],py:[
{id:'py-intro',t:'Python 簡介',b:[['p','Python 是語法簡潔、容易閱讀的程式語言，廣泛用於資料分析、人工智慧、網站後端與自動化。用<code>print()</code>就能在畫面輸出文字。'],['code','print("Hello, World!")','Hello, World!'],['tip','Python 用「縮排」區分程式區塊，通常是 4 個空格，不能亂縮。'],['p','註解以 <code>#</code> 開頭，Python 會忽略它。'],['code','# 這是註解\nprint("註解不會被執行")','註解不會被執行']]},
{id:'py-var',t:'變數與資料型態',b:[['p','變數不用事先宣告型態，直接指定值即可。常見型態：<code>int</code>（整數）、<code>float</code>（小數）、<code>str</code>（字串）、<code>bool</code>（布林）。'],['code','name = "小明"\nage = 18\nheight = 175.5\nis_student = True\nprint(name, age, type(height))',"小明 18 <class 'float'>"],['h','型態轉換'],['code','x = int("10") + 5\ny = str(3.14)\nprint(x, y)','15 3.14']]},
{id:'py-op',t:'運算子與輸入輸出',b:[['p','算術：<code>+ - * / // % **</code>。其中 <code>//</code> 是整除、<code>%</code> 是餘數、<code>**</code> 是次方。'],['code','print(7 / 2, 7 // 2, 7 % 2, 2 ** 3)','3.5 3 1 8'],['h','讀取使用者輸入'],['code','name = input("你的名字：")\nprint(f"哈囉，{name}！")','你的名字：Amy\n哈囉，Amy！'],['tip','<code>input()</code> 永遠回傳字串，要計算請先用 <code>int()</code> 轉換。']]},
{id:'py-if',t:'條件判斷 if',b:[['p','使用 <code>if / elif / else</code>，條件後面要加冒號，並縮排。'],['code','score = 85\nif score >= 90:\n    print("A")\nelif score >= 80:\n    print("B")\nelse:\n    print("C")','B'],['p','比較運算子：<code>== != > < >= <=</code>；邏輯運算子：<code>and or not</code>。']]},
{id:'py-loop',t:'迴圈 for / while',b:[['p','<code>for</code> 適合已知次數或走訪資料；<code>while</code> 適合條件成立就持續執行。'],['code','for i in range(1, 4):\n    print(i)','1\n2\n3'],['code','n = 3\nwhile n > 0:\n    print(n)\n    n -= 1','3\n2\n1'],['tip','<code>break</code> 跳出迴圈，<code>continue</code> 跳過本次。<code>range(1,4)</code> 不包含 4。']]},
{id:'py-func',t:'函式',b:[['p','用<code>def</code>定義函式，<code>return</code>回傳結果，可設定預設參數。'],['code','def add(a, b=10):\n    return a + b\n\nprint(add(3, 4))\nprint(add(5))','7\n15']]},
{id:'py-list',t:'串列與字典',b:[['p','串列 <code>list</code> 有順序、可修改；字典 <code>dict</code> 以「鍵:值」儲存資料。'],['code','fruits = ["蘋果", "香蕉"]\nfruits.append("芒果")\nprint(fruits[0], len(fruits))','蘋果 3'],['code','stu = {"name": "小明", "age": 18}\nstu["age"] = 19\nfor k, v in stu.items():\n    print(k, v)','name 小明\nage 19'],['tip','串列生成式：<code>[x*x for x in range(5)]</code> 會得到 <code>[0, 1, 4, 9, 16]</code>。']]},
{id:'py-str',t:'字串處理',b:[['p','字串是不可變的序列，可用索引與切片取值：<code>s[起:迄:間隔]</code>，負數表示從尾端算起。'],['code','s = "Hello Python"\nprint(s[0], s[-1], s[0:5], s[::-1])\nprint(s.upper(), s.replace("Hello", "Hi"))\nprint(s.split(" "))','H n Hello nohtyP olleH\nHELLO PYTHON Hi Python\n[\'Hello\', \'Python\']'],['h','f-string 格式化'],['code','pi = 3.14159\nprint(f"圓周率約 {pi:.2f}")\nprint("、".join(["a", "b", "c"]))','圓周率約 3.14\na、b、c'],['tip','常用方法：<code>strip()</code> 去頭尾空白、<code>find()</code> 找位置、<code>startswith()</code> 判斷開頭、<code>in</code> 判斷是否包含。']]},
{id:'py-tuple',t:'元組與集合',b:[['p','元組 <code>tuple</code> 不可修改；集合 <code>set</code> 不重複且無順序，適合去除重複與做交集、聯集。'],['code','pt = (3, 4)\nx, y = pt          # 解包\nprint(x + y)','7'],['code','a = {1, 2, 3, 3}\nb = {3, 4}\nprint(a, a & b, a | b)','{1, 2, 3} {3} {1, 2, 3, 4}'],['tip','去除串列重複：<code>list(set(data))</code>（順序可能改變）。']]},
{id:'py-exc',t:'例外處理',b:[['p','程式出錯時會丟出例外，用 <code>try / except</code> 攔截，避免整個程式崩潰。<code>finally</code> 一定會執行。'],['code','try:\n    n = int("abc")\nexcept ValueError:\n    print("請輸入數字")\nelse:\n    print(n)\nfinally:\n    print("結束")','請輸入數字\n結束'],['code','def divide(a, b):\n    if b == 0:\n        raise ZeroDivisionError("除數不可為 0")\n    return a / b','（主動用 raise 丟出例外）'],['tip','常見例外：<code>ValueError</code>、<code>TypeError</code>、<code>KeyError</code>、<code>IndexError</code>、<code>FileNotFoundError</code>。']]},
{id:'py-file',t:'檔案讀寫',b:[['p','用 <code>with open()</code> 開檔，離開區塊時會自動關閉檔案。模式：<code>r</code> 讀、<code>w</code> 覆寫、<code>a</code> 附加。'],['code','with open("note.txt", "w", encoding="utf-8") as f:\n    f.write("第一行\\n第二行\\n")\n\nwith open("note.txt", "r", encoding="utf-8") as f:\n    for line in f:\n        print(line.strip())','第一行\n第二行'],['tip','處理中文請務必加上 <code>encoding="utf-8"</code>，否則在部分系統會亂碼。']]},
{id:'py-class',t:'類別與物件',b:[['p','<code>class</code> 定義類別，<code>__init__</code> 是建構子，<code>self</code> 代表物件本身。繼承時把父類別寫在括號內。'],['code','class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        print(self.name, "發出聲音")\n\nclass Dog(Animal):\n    def speak(self):\n        print(self.name, "說：汪！")\n\nfor a in [Animal("動物"), Dog("小黑")]:\n    a.speak()','動物 發出聲音\n小黑 說：汪！'],['tip','子類別覆寫父類別同名方法，就是「多型」的表現。']]},
{id:'py-mod',t:'模組與套件',b:[['p','用 <code>import</code> 載入標準函式庫或自己寫的 .py 檔；第三方套件用 <code>pip install 套件名</code> 安裝。'],['code','import math\nfrom random import randint\nfrom datetime import date\n\nprint(math.sqrt(16))\nprint(1 <= randint(1, 6) <= 6)','4.0\nTrue'],['tip','入門常用：<code>requests</code>（網路請求）、<code>pandas</code>（資料分析）、<code>matplotlib</code>（繪圖）。建議用 <code>python -m venv venv</code> 建立虛擬環境。']]},
{id:'py-lambda',t:'lambda 與高階函式',b:[['p','<code>lambda</code> 是一行的匿名函式，常搭配 <code>map</code>、<code>filter</code>、<code>sorted</code> 這類「把函式當參數」的高階函式使用。'],['code','sq = lambda x: x * x\nprint(sq(5))\nprint(list(map(lambda x: x * 2, [1, 2, 3])))\nprint(list(filter(lambda x: x % 2 == 0, range(1, 7))))','25\n[2, 4, 6]\n[2, 4, 6]'],['h','自訂排序 key'],['code','words = ["banana", "kiwi", "apple"]\nprint(*sorted(words, key=len))\nprint(*sorted(words, key=lambda w: w[-1]))','kiwi apple banana\nbanana apple kiwi'],['tip','lambda 只適合簡短運算；邏輯複雜就改用 <code>def</code>，可讀性比較重要。']]},
{id:'py-comp',t:'生成式與常用內建函式',b:[['p','生成式能用一行建立串列、字典、集合，比傳統迴圈簡潔。'],['code','squares = [x * x for x in range(5)]\nevens = [x for x in range(10) if x % 2 == 0]\nd = {x: x ** 2 for x in range(3)}\nprint(squares, evens, d)','[0, 1, 4, 9, 16] [0, 2, 4, 6, 8] {0: 0, 1: 1, 2: 4}'],['h','enumerate 與 zip'],['code','names = ["小明", "小華"]\nscores = [90, 85]\nfor i, n in enumerate(names, start=1):\n    print(i, n)\nfor n, s in zip(names, scores):\n    print(n, s)','1 小明\n2 小華\n小明 90\n小華 85'],['tip','常用內建：<code>sum</code>、<code>max</code>、<code>min</code>、<code>any</code>、<code>all</code>、<code>abs</code>、<code>round</code>。']]},
{id:'py-gen',t:'迭代器與生成器',b:[['p','能被 <code>for</code> 走訪的物件叫可迭代物件。<b>生成器</b>用 <code>yield</code> 一次產生一個值，不會一次把所有資料放進記憶體，適合處理大量資料。'],['code','def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor x in countdown(3):\n    print(x)','3\n2\n1'],['code','gen = (x * x for x in range(1000000))\nprint(next(gen), next(gen), next(gen))','0 1 4'],['tip','把生成式的方括號 <code>[]</code> 換成圓括號 <code>()</code> 就是生成器表達式，不會立刻計算。']]},
{id:'py-deco',t:'裝飾器',b:[['p','裝飾器是「接收函式、回傳新函式」的函式，可在不修改原函式的情況下加上功能，例如記錄、計時、權限檢查。用 <code>@名稱</code> 套用。'],['code','def log(func):\n    def wrapper(*args, **kwargs):\n        print("呼叫", func.__name__)\n        return func(*args, **kwargs)\n    return wrapper\n\n@log\ndef add(a, b):\n    return a + b\n\nprint(add(1, 2))','呼叫 add\n3'],['tip','<code>*args</code> 收集多餘的位置參數，<code>**kwargs</code> 收集關鍵字參數，讓 wrapper 能套用在任何函式上。']]},
{id:'py-json',t:'JSON 與 CSV',b:[['p','JSON 是前後端與 API 最常用的資料格式；CSV 是表格資料的簡單格式。兩者都有標準函式庫支援。'],['code','import json\n\ndata = {"name": "小明", "scores": [90, 85]}\ns = json.dumps(data, ensure_ascii=False)\nprint(s)\nprint(json.loads(s)["scores"][0])','{"name": "小明", "scores": [90, 85]}\n90'],['h','讀寫 CSV'],['code','import csv\n\nwith open("a.csv", "w", newline="", encoding="utf-8") as f:\n    w = csv.writer(f)\n    w.writerow(["name", "age"])\n    w.writerow(["小明", 18])\n\nwith open("a.csv", encoding="utf-8") as f:\n    for row in csv.DictReader(f):\n        print(row["name"], row["age"])','小明 18'],['tip','中文輸出 JSON 請加 <code>ensure_ascii=False</code>，否則會變成 \\uXXXX 編碼。']]},
{id:'py-re',t:'正則表示式',b:[['p','正則表示式（Regex）用「字串樣式」搜尋、驗證、取代文字，用 <code>re</code> 模組。寫樣式時建議加 <code>r</code> 前綴（原始字串），避免反斜線被跳脫。'],['p','常用符號：<code>\\\\d</code> 數字、<code>\\\\w</code> 字母數字底線、<code>\\\\s</code> 空白、<code>.</code> 任意字元、<code>+</code> 一次以上、<code>*</code> 零次以上、<code>?</code> 零或一次、<code>{n}</code> 剛好 n 次、<code>^ $</code> 開頭與結尾。'],['code','import re\n\ntext = "電話 0912-345-678，0987-654-321"\nprint(*re.findall(r"\\\\d{4}-\\\\d{3}-\\\\d{3}", text))\nprint(re.sub(r"\\\\s+", " ", "a   b    c"))','0912-345-678 0987-654-321\na b c'],['h','擷取分組'],['code','m = re.search(r"(\\\\w+)@(\\\\w+)\\\\.com", "聯絡 amy@mail.com")\nif m:\n    print(m.group(1), m.group(2))','amy mail'],['tip','想反覆使用同一樣式時，先 <code>re.compile()</code> 可提升效能。複雜樣式可用 regex101.com 即時測試。']]},
{id:'py-type',t:'型別提示',b:[['p','型別提示（Type Hints）為參數和回傳值標註型別，讓程式更好讀、編輯器能自動補全。它<b>不會</b>在執行時強制檢查，要檢查請搭配 <code>mypy</code> 或 <code>pyright</code>。'],['code','def greet(name: str, times: int = 1) -> str:\n    return (name + "! ") * times\n\nprint(greet("Amy", 2))','Amy! Amy! '],['code','def find(xs: list[int], target: int) -> int | None:\n    for i, x in enumerate(xs):\n        if x == target:\n            return i\n    return None\n\nprint(find([5, 7, 9], 9))','2'],['tip','常見寫法：<code>list[int]</code>、<code>dict[str, int]</code>、<code>tuple[int, str]</code>、<code>X | None</code>（Python 3.10+）。']]},
{id:'py-test',t:'單元測試',b:[['p','單元測試能確保修改程式後不會把舊功能搞壞。Python 內建 <code>unittest</code>，社群更常用輕鬆的 <code>pytest</code>。'],['code','import unittest\n\ndef add(a, b):\n    return a + b\n\nclass TestAdd(unittest.TestCase):\n    def test_basic(self):\n        self.assertEqual(add(1, 2), 3)\n    def test_negative(self):\n        self.assertEqual(add(-1, 1), 0)\n\nif __name__ == "__main__":\n    unittest.main()','..\nRan 2 tests in 0.000s\n\nOK'],['h','pytest（先 pip install pytest）'],['code','# test_calc.py\ndef add(a, b):\n    return a + b\n\ndef test_add():\n    assert add(1, 2) == 3','執行 pytest 結果：1 passed'],['tip','pytest 會自動找檔名以 <code>test_</code> 開頭、函式名以 <code>test_</code> 開頭的測試，直接用 <code>assert</code> 即可。']]},
{id:'py-async',t:'asyncio 非同步',b:[['p','非同步適合 I/O 密集的工作（網路請求、讀寫資料庫），等待時可以切換去做別的事。<code>async def</code> 定義協程，<code>await</code> 等待結果。'],['code','import asyncio\n\nasync def work(name, sec):\n    await asyncio.sleep(sec)\n    print(name, "完成")\n\nasync def main():\n    await asyncio.gather(work("A", 2), work("B", 1))\n\nasyncio.run(main())','B 完成\nA 完成'],['tip','兩個任務同時進行，總共只花約 2 秒。計算密集的工作（CPU-bound）請改用 <code>multiprocessing</code>。']]},
{id:'py-requests',t:'實戰：requests 網路請求',b:[['p','<code>requests</code> 是最常用的 HTTP 套件，可呼叫 API 或下載網頁。先安裝：<code>pip install requests</code>。'],['code','import requests\n\nr = requests.get("https://api.github.com", timeout=10)\nprint(r.status_code)\nprint(r.headers["content-type"])\ndata = r.json()\nprint(type(data))','200\napplication/json; charset=utf-8\n<class \'dict\'>'],['h','帶參數與錯誤處理'],['code','try:\n    r = requests.get("https://httpbin.org/get", params={"q": "python"}, timeout=10)\n    r.raise_for_status()\n    print(r.json()["args"]["q"])\nexcept requests.RequestException as e:\n    print("連線失敗", e)','python'],['tip','一定要設定 <code>timeout</code>，否則網路卡住時程式會一直等。爬網頁前請先看網站的 robots.txt 與使用條款，並控制請求頻率。']]},
{id:'py-pandas',t:'實戰：pandas 與 matplotlib',b:[['p','<code>pandas</code> 處理表格資料，<code>matplotlib</code> 畫圖。安裝：<code>pip install pandas matplotlib</code>。'],['code','import pandas as pd\n\ndf = pd.DataFrame({\n    "name": ["小明", "小華", "小美"],\n    "score": [90, 85, 95],\n})\nprint(df["score"].mean())\nprint(df[df["score"] >= 90])','90.0\n  name  score\n0   小明     90\n2   小美     95'],['h','讀取檔案與畫圖'],['code','import matplotlib.pyplot as plt\n\n# df = pd.read_csv("scores.csv")\nplt.bar(df["name"], df["score"])\nplt.title("Scores")\nplt.savefig("score.png")','（產生 score.png 長條圖）'],['tip','常用：<code>df.head()</code> 看前幾列、<code>df.describe()</code> 看統計、<code>df.groupby("欄位").mean()</code> 分組統計。圖表要顯示中文需另外設定中文字型。']]},
{id:'py-flask',t:'實戰：Flask 小網站',b:[['p','Flask 是輕量的網站框架，適合入門與小型 API。安裝：<code>pip install flask</code>。把下面存成 <code>app.py</code>，執行 <code>python app.py</code>。'],['code','from flask import Flask, jsonify\n\napp = Flask(__name__)\n\n@app.route("/")\ndef home():\n    return "Hello, Flask!"\n\n@app.route("/hi/<name>")\ndef hi(name):\n    return f"哈囉，{name}"\n\n@app.route("/api/user")\ndef user():\n    return jsonify(name="小明", age=18)\n\nif __name__ == "__main__":\n    app.run(debug=True)','開啟 http://127.0.0.1:5000/ 顯示 Hello, Flask!\n/hi/Amy 顯示 哈囉，Amy\n/api/user 回傳 JSON'],['tip','<code>debug=True</code> 只能在開發時使用，上線請改用 gunicorn 等正式伺服器。專案變大後可學 Blueprint 與 Flask-SQLAlchemy，或改用 FastAPI、Django。']]}
],jv:[
{id:'jv-intro',t:'Java 簡介與 Hello World',b:[['p','Java 是物件導向、強型別的語言，「一次編寫，到處執行」，常用於 Android、企業後端。所有程式都必須寫在類別（class）裡，從 <code>main</code> 方法開始執行。'],['code','public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}','Hello, World!'],['tip','檔名必須與 public class 同名（Main.java），每行結尾要加分號 <code>;</code>。']]},
{id:'jv-var',t:'變數與資料型態',b:[['p','Java 變數必須先宣告型態。基本型態：<code>int</code>、<code>double</code>、<code>char</code>、<code>boolean</code>；字串 <code>String</code> 是類別。'],['code','int age = 18;\ndouble h = 175.5;\nchar grade = \'A\';\nboolean ok = true;\nString name = "小明";\nSystem.out.println(name + " " + age);','小明 18'],['h','型態轉換'],['code','double d = 9.7;\nint x = (int) d;   // 強制轉型\nSystem.out.println(x);','9']]},
{id:'jv-op',t:'運算子與輸入',b:[['p','算術運算子與 Python 類似，但整數相除結果仍是整數。'],['code','System.out.println(7 / 2);\nSystem.out.println(7 % 2);\nSystem.out.println(7 / 2.0);','3\n1\n3.5'],['h','使用 Scanner 讀取輸入'],['code','import java.util.Scanner;\n\nScanner sc = new Scanner(System.in);\nSystem.out.print("輸入整數：");\nint n = sc.nextInt();\nSystem.out.println(n * 2);','輸入整數：5\n10']]},
{id:'jv-if',t:'條件判斷',b:[['p','條件要放在括號內，區塊使用大括號。'],['code','int score = 85;\nif (score >= 90) {\n    System.out.println("A");\n} else if (score >= 80) {\n    System.out.println("B");\n} else {\n    System.out.println("C");\n}','B'],['p','邏輯運算子是 <code>&&</code>、<code>||</code>、<code>!</code>。字串比較請用 <code>equals()</code>，不要用 <code>==</code>。']]},
{id:'jv-loop',t:'迴圈',b:[['p','<code>for</code>、<code>while</code>、<code>do-while</code>，以及走訪集合的 for-each。'],['code','for (int i = 1; i <= 3; i++) {\n    System.out.println(i);\n}','1\n2\n3'],['code','int[] nums = {10, 20, 30};\nfor (int n : nums) {\n    System.out.println(n);\n}','10\n20\n30']]},
{id:'jv-method',t:'方法 Method',b:[['p','方法要指定回傳型態與參數型態，無回傳值用 <code>void</code>。'],['code','static int add(int a, int b) {\n    return a + b;\n}\n\npublic static void main(String[] args) {\n    System.out.println(add(3, 4));\n}','7'],['tip','同名但參數不同的方法稱為「多載（Overload）」。']]},
{id:'jv-array',t:'陣列與 ArrayList',b:[['p','陣列長度固定；<code>ArrayList</code> 可動態增減，需 import。'],['code','import java.util.ArrayList;\n\nArrayList<String> list = new ArrayList<>();\nlist.add("蘋果");\nlist.add("香蕉");\nSystem.out.println(list.get(0) + " " + list.size());','蘋果 2']]},
{id:'jv-class',t:'類別與物件',b:[['p','類別是藍圖，物件是依藍圖建立的實體。用建構子初始化屬性，並以 <code>private</code> 封裝。'],['code','class Student {\n    private String name;\n    Student(String name) { this.name = name; }\n    void hello() {\n        System.out.println("我是" + name);\n    }\n}\n\nStudent s = new Student("小明");\ns.hello();','我是小明'],['tip','物件導向三大特性：封裝、繼承、多型。']]},
{id:'jv-str',t:'字串 String',b:[['p','<code>String</code> 是不可變物件。字串比較請用 <code>equals()</code>；大量串接請用 <code>StringBuilder</code> 提升效能。'],['code','String s = "Hello Java";\nSystem.out.println(s.length());\nSystem.out.println(s.substring(0, 5));\nSystem.out.println(s.toUpperCase());\nSystem.out.println(s.indexOf("Java"));\nSystem.out.println(s.equals("hello java"));','10\nHello\nHELLO JAVA\n6\nfalse'],['code','StringBuilder sb = new StringBuilder();\nfor (int i = 1; i <= 3; i++) sb.append(i).append(",");\nSystem.out.println(sb);','1,2,3,'],['tip','忽略大小寫比較用 <code>equalsIgnoreCase()</code>；格式化可用 <code>String.format("%.2f", 3.14159)</code>。']]},
{id:'jv-switch',t:'switch 與多重選擇',b:[['p','<code>switch</code> 適合單一變數對應多個固定值。傳統寫法要加 <code>break</code>，否則會往下穿透；新版（Java 14+）可用箭頭語法。'],['code','int day = 3;\nswitch (day) {\n    case 1: System.out.println("週一"); break;\n    case 3: System.out.println("週三"); break;\n    default: System.out.println("其他");\n}','週三'],['code','String r = switch (day) {\n    case 6, 7 -> "假日";\n    default -> "上班日";\n};\nSystem.out.println(r);','上班日']]},
{id:'jv-map',t:'集合：HashMap 與 HashSet',b:[['p','<code>HashMap</code> 以「鍵→值」儲存，鍵不可重複；<code>HashSet</code> 儲存不重複元素。泛型 <code>&lt;&gt;</code> 內要用包裝型別（Integer、Double 等）。'],['code','import java.util.*;\n\nHashMap<String, Integer> score = new HashMap<>();\nscore.put("小明", 90);\nscore.put("小華", 85);\nfor (String k : score.keySet()) {\n    System.out.println(k + " " + score.get(k));\n}','小明 90\n小華 85（輸出順序不保證）'],['code','HashSet<Integer> set = new HashSet<>();\nset.add(1); set.add(1); set.add(2);\nSystem.out.println(set.size());','2']]},
{id:'jv-inherit',t:'繼承與多型',b:[['p','用 <code>extends</code> 繼承父類別，<code>super</code> 呼叫父類別，<code>@Override</code> 覆寫方法。父類別變數可指向子類別物件，這就是多型。'],['code','class Animal {\n    void speak() { System.out.println("動物發出聲音"); }\n}\nclass Dog extends Animal {\n    @Override\n    void speak() { System.out.println("汪汪！"); }\n}\n\nAnimal a = new Dog();\na.speak();','汪汪！'],['tip','Java 只允許單一繼承，但一個類別可以實作多個介面。']]},
{id:'jv-iface',t:'抽象類別與介面',b:[['p','<code>abstract</code> 類別不能直接建立物件，可含有未實作的抽象方法；<code>interface</code> 只定義「規格」，由類別用 <code>implements</code> 實作。'],['code','interface Shape {\n    double area();\n}\nclass Circle implements Shape {\n    double r;\n    Circle(double r) { this.r = r; }\n    public double area() { return Math.PI * r * r; }\n}\n\nShape s = new Circle(2);\nSystem.out.printf("%.2f", s.area());','12.57'],['tip','設計原則：「針對介面寫程式，而不是針對實作」，讓程式更容易替換與測試。']]},
{id:'jv-exc',t:'例外處理',b:[['p','Java 用 <code>try / catch / finally</code> 處理例外。受檢例外（如 IOException）必須處理或用 <code>throws</code> 宣告；<code>throw</code> 可主動丟出例外。'],['code','try {\n    int[] a = new int[2];\n    a[5] = 1;\n} catch (ArrayIndexOutOfBoundsException e) {\n    System.out.println("索引超出範圍");\n} finally {\n    System.out.println("結束");\n}','索引超出範圍\n結束'],['code','static void check(int age) {\n    if (age < 0) throw new IllegalArgumentException("年齡不可為負");\n}','（輸入負數時丟出例外）'],['tip','常見例外：<code>NullPointerException</code>、<code>NumberFormatException</code>、<code>ClassCastException</code>。']]},
{id:'jv-generic',t:'泛型 Generics',b:[['p','泛型讓類別或方法在「使用時」才決定型態，既能重複使用，又有編譯期型別檢查，避免強制轉型的錯誤。<code>&lt;T&gt;</code> 是型態參數。'],['code','class Box<T> {\n    private T value;\n    Box(T value) { this.value = value; }\n    T get() { return value; }\n}\n\nBox<String> a = new Box<>("Hi");\nBox<Integer> b = new Box<>(10);\nSystem.out.println(a.get() + b.get());','Hi10'],['h','泛型方法'],['code','static <T> void show(T x) {\n    System.out.println("值：" + x);\n}\n\nshow(3);\nshow("abc");','值：3\n值：abc'],['tip','泛型只能用物件型態，基本型態要用包裝類別：<code>int→Integer</code>、<code>double→Double</code>。']]},
{id:'jv-stream',t:'Lambda 與 Stream',b:[['p','Lambda 的寫法是 <code>(參數) -&gt; 運算式</code>，用來簡潔地表示只有一個抽象方法的介面（函式介面）。<b>Stream</b> 則用「串接」方式處理集合：篩選、轉換、聚合。'],['code','import java.util.*;\n\nList<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\nint sum = nums.stream()\n    .filter(n -> n % 2 == 0)\n    .mapToInt(n -> n * n)\n    .sum();\nSystem.out.println(sum);','56'],['code','List<String> r = List.of("bob", "amy").stream()\n    .map(String::toUpperCase)\n    .sorted()\n    .toList();\nSystem.out.println(r);','[AMY, BOB]'],['tip','<code>String::toUpperCase</code> 稱為方法參考，等同 <code>s -> s.toUpperCase()</code>。Stream 只能用一次，且最後要有結尾操作（如 <code>sum</code>、<code>toList</code>）才會執行。']]},
{id:'jv-io',t:'檔案讀寫',b:[['p','現代 Java 建議用 <code>java.nio.file.Files</code> 讀寫檔案，程式碼很精簡。檔案操作會丟出 <code>IOException</code>，必須處理或用 <code>throws</code> 宣告。'],['code','import java.nio.file.*;\nimport java.util.*;\n\npublic static void main(String[] args) throws Exception {\n    Path p = Path.of("note.txt");\n    Files.write(p, List.of("第一行", "第二行"));\n    for (String line : Files.readAllLines(p)) {\n        System.out.println(line);\n    }\n}','第一行\n第二行'],['tip','資源需要關閉時（如 <code>BufferedReader</code>）請用 try-with-resources：<code>try (var br = ...) { }</code>，離開區塊會自動關閉。']]},
{id:'jv-enum',t:'列舉 enum 與 record',b:[['p','<code>enum</code> 表示一組固定的常數（例如星期、等級），比用整數或字串安全。<code>record</code>（Java 16+）可快速定義只存資料的不可變類別。'],['code','enum Level { LOW, MID, HIGH }\n\nLevel l = Level.MID;\nString msg = switch (l) {\n    case LOW -> "低";\n    case MID -> "中";\n    case HIGH -> "高";\n};\nSystem.out.println(msg);','中'],['code','record Point(int x, int y) {}\n\nPoint p = new Point(3, 4);\nSystem.out.println(p.x() + " " + p);','3 Point[x=3, y=4]'],['tip','record 會自動產生建構子、<code>equals</code>、<code>hashCode</code>、<code>toString</code>，非常適合當資料傳輸物件。']]},
{id:'jv-thread',t:'多執行緒',b:[['p','執行緒讓程式同時做多件事。最簡單的方式是搭配 Lambda 建立 <code>Thread</code>，<code>start()</code> 啟動，<code>join()</code> 等它結束。'],['code','public static void main(String[] args) throws Exception {\n    Thread t = new Thread(() ->\n        System.out.println("子執行緒執行"));\n    t.start();\n    t.join();\n    System.out.println("主執行緒結束");\n}','子執行緒執行\n主執行緒結束'],['h','執行緒池'],['code','import java.util.concurrent.*;\n\nExecutorService pool = Executors.newFixedThreadPool(2);\npool.submit(() -> System.out.println("任務 A"));\npool.submit(() -> System.out.println("任務 B"));\npool.shutdown();','任務 A\n任務 B（順序不保證）'],['tip','多個執行緒同時修改同一份資料會出錯，可用 <code>synchronized</code> 或 <code>AtomicInteger</code> 保護。實務上優先使用執行緒池，而不是自己 new Thread。']]},
{id:'jv-coll',t:'集合進階與排序',b:[['p','選對集合很重要：<code>ArrayList</code> 隨機存取快；<code>HashSet/HashMap</code> 查找快但無序；<code>LinkedHashMap</code> 保留加入順序；<code>TreeMap/TreeSet</code> 依鍵自動排序。'],['code','import java.util.*;\n\nList<Integer> list = new ArrayList<>(List.of(3, 1, 2));\nCollections.sort(list);\nSystem.out.println(list);\nlist.sort(Comparator.reverseOrder());\nSystem.out.println(list);','[1, 2, 3]\n[3, 2, 1]'],['h','計次（常見用法）'],['code','String[] ws = {"a", "b", "a"};\nMap<String, Integer> cnt = new TreeMap<>();\nfor (String w : ws) {\n    cnt.merge(w, 1, Integer::sum);\n}\nSystem.out.println(cnt);','{a=2, b=1}'],['tip','依物件欄位排序：<code>list.sort(Comparator.comparing(Student::getAge))</code>。自訂物件當 Map 的鍵時，要記得覆寫 <code>equals</code> 與 <code>hashCode</code>。']]},
{id:'jv-time',t:'日期與時間 API',b:[['p','不要再用舊的 <code>Date</code>。現代 Java 使用 <code>java.time</code>，物件都是不可變的。常用類別：<code>LocalDate</code>、<code>LocalTime</code>、<code>LocalDateTime</code>、<code>ZonedDateTime</code>。'],['code','import java.time.*;\nimport java.time.format.DateTimeFormatter;\nimport java.time.temporal.ChronoUnit;\n\nLocalDate d = LocalDate.of(2026, 11, 10);\nSystem.out.println(d.plusDays(30));\nSystem.out.println(d.getDayOfWeek());\nSystem.out.println(d.format(DateTimeFormatter.ofPattern("yyyy/MM/dd")));\nSystem.out.println(ChronoUnit.DAYS.between(LocalDate.parse("2026-01-01"), d));','2026-12-10\nTUESDAY\n2026/11/10\n313'],['tip','需要時區時用 <code>ZonedDateTime.now(ZoneId.of("Asia/Taipei"))</code>。格式化符號：<code>yyyy</code> 年、<code>MM</code> 月、<code>dd</code> 日、<code>HH</code> 24 小時、<code>mm</code> 分、<code>ss</code> 秒。']]},
{id:'jv-opt',t:'Optional',b:[['p','<code>Optional</code> 用來表示「可能沒有值」，讓呼叫端明確知道要處理，減少 <code>NullPointerException</code>。'],['code','import java.util.Optional;\n\nOptional<String> name = Optional.of("Amy");\nOptional<String> none = Optional.empty();\n\nSystem.out.println(name.map(String::toUpperCase).orElse("無"));\nSystem.out.println(none.orElse("預設"));\nname.ifPresent(n -> System.out.println("哈囉 " + n));','AMY\n預設\n哈囉 Amy'],['tip','適合當「方法的回傳型別」。不建議當欄位或參數，也避免未判斷就直接呼叫 <code>get()</code>，改用 <code>orElse</code>、<code>orElseThrow</code>。']]},
{id:'jv-test',t:'JUnit 單元測試',b:[['p','JUnit 5 是 Java 最主流的測試框架。測試方法加上 <code>@Test</code>，用 <code>assertEquals</code>、<code>assertTrue</code>、<code>assertThrows</code> 等斷言驗證結果。'],['code','import org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\nclass CalcTest {\n    @Test\n    void addWorks() {\n        assertEquals(3, 1 + 2);\n    }\n\n    @Test\n    void divideByZero() {\n        assertThrows(ArithmeticException.class, () -> {\n            int x = 1 / 0;\n        });\n    }\n}','2 tests successful'],['tip','建立專案後，Maven 用 <code>mvn test</code>、Gradle 用 <code>gradle test</code> 執行測試。寫測試的好節奏：準備（Arrange）→ 執行（Act）→ 驗證（Assert）。']]},
{id:'jv-inner',t:'內部類別與匿名類別',b:[['p','類別裡面可以再定義類別。<b>成員內部類別</b>能直接存取外部類別的成員；<b>static 巢狀類別</b>不依附外部物件；<b>匿名類別</b>是沒有名字、即時實作介面的類別。'],['code','class Outer {\n    private int x = 10;\n\n    class Inner {\n        int get() { return x; }\n    }\n    static class Nested {\n        String hi() { return "Nested"; }\n    }\n}\n\nOuter o = new Outer();\nOuter.Inner in = o.new Inner();\nSystem.out.println(in.get());\nSystem.out.println(new Outer.Nested().hi());','10\nNested'],['code','Runnable r = new Runnable() {\n    public void run() {\n        System.out.println("匿名類別");\n    }\n};\nr.run();','匿名類別'],['tip','只有一個抽象方法的介面，直接用 Lambda 更簡潔：<code>Runnable r = () -> ...;</code>。']]},
{id:'jv-build',t:'Maven 與 Gradle',b:[['p','建置工具負責「下載函式庫、編譯、測試、打包」。Maven 用 <code>pom.xml</code> 設定，Gradle 用 <code>build.gradle(.kts)</code>。兩者都能從中央倉庫自動下載相依套件。'],['h','Maven：在 pom.xml 加入相依套件'],['code','<dependencies>\n  <dependency>\n    <groupId>com.google.code.gson</groupId>\n    <artifactId>gson</artifactId>\n    <version>2.11.0</version>\n  </dependency>\n</dependencies>','（存檔後 Maven 會自動下載 gson）'],['h','Gradle（Kotlin DSL）'],['code','dependencies {\n    implementation("com.google.code.gson:gson:2.11.0")\n    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")\n}','（同步後自動下載）'],['p','常用指令：Maven <code>mvn compile</code>、<code>mvn test</code>、<code>mvn package</code>；Gradle <code>gradle build</code>、<code>gradle test</code>。'],['tip','套件的 groupId、版本可到 search.maven.org 查詢。新專案可用 IntelliJ IDEA 或 start.spring.io 直接產生。']]},
{id:'jv-jdbc',t:'JDBC 連接資料庫',b:[['p','JDBC 是 Java 連接關聯式資料庫的標準介面。需要先在專案加入該資料庫的驅動（如 MySQL、PostgreSQL、SQLite）。查詢請一律使用 <code>PreparedStatement</code>。'],['code','import java.sql.*;\n\nString url = "jdbc:sqlite:test.db";\nString sql = "SELECT name FROM user WHERE age > ?";\n\ntry (Connection c = DriverManager.getConnection(url);\n     PreparedStatement ps = c.prepareStatement(sql)) {\n    ps.setInt(1, 18);\n    try (ResultSet rs = ps.executeQuery()) {\n        while (rs.next()) {\n            System.out.println(rs.getString("name"));\n        }\n    }\n} catch (SQLException e) {\n    e.printStackTrace();\n}','小明\n小華'],['tip','用 <code>?</code> 佔位符能防止 <b>SQL Injection</b>，千萬不要用字串相加組 SQL。正式專案建議搭配連線池（HikariCP）與 ORM（JPA／Hibernate）。']]},
{id:'jv-spring',t:'Spring Boot 入門',b:[['p','Spring Boot 是 Java 後端最主流的框架，內建伺服器，設定簡單。到 <code>start.spring.io</code> 選 Spring Web 產生專案，下載後即可執行。'],['code','@SpringBootApplication\npublic class App {\n    public static void main(String[] args) {\n        SpringApplication.run(App.class, args);\n    }\n}\n\n@RestController\nclass HelloController {\n    @GetMapping("/hello")\n    String hello() {\n        return "Hello, Spring Boot!";\n    }\n\n    @GetMapping("/user/{name}")\n    String user(@PathVariable String name) {\n        return "哈囉，" + name;\n    }\n}','開啟 http://localhost:8080/hello 顯示 Hello, Spring Boot!\n/user/Amy 顯示 哈囉，Amy'],['tip','實務上常分層：Controller（接收請求）→ Service（商業邏輯）→ Repository（存取資料庫）。下一步可學 Spring Data JPA、驗證與例外處理、Spring Security。']]}
]};

const S={mem:{},get(k,d){try{const v=localStorage.getItem('cn_'+k);if(v!==null)return JSON.parse(v)}catch(e){}return k in this.mem?this.mem[k]:d},set(k,v){this.mem[k]=v;try{localStorage.setItem('cn_'+k,JSON.stringify(v))}catch(e){}}};
const names={vs:'VS Code',py:'Python',jv:'Java'};
const all=[...L.vs,...L.py,...L.jv];
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  let id=location.hash.slice(1);
  let cur=all.find(x=>x.id===id)||L.vs[0];
  const lang=cur.id.slice(0,2);
  document.documentElement.style.setProperty('--accent',{py:'var(--py)',jv:'var(--jv)',vs:'#007acc'}[lang]);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const kw=$('#q').value.trim().toLowerCase();
  const list=L[lang].filter(x=>!kw||x.t.toLowerCase().includes(kw));
  const dn=S.get('done',{});const total=L[lang].length,cnt=L[lang].filter(x=>dn[x.id]).length;
  $('#nav').innerHTML=`<h4>${names[lang]} 教學　已完成 ${cnt}/${total}</h4><div class="prog"><i style="width:${cnt/total*100}%"></i></div>`+list.map(x=>`<a href="#${x.id}" class="${x.id===cur.id?'on':''}">${dn[x.id]?'✅ ':''}${x.t}</a>`).join('');
  const i=L[lang].indexOf(cur);
  let h=`<h1>${cur.t}</h1><div class="crumb">${names[lang]} › 第 ${i+1} 章</div>`;
  for(const [k,a,o] of cur.b){
    if(k==='p')h+=`<p>${a}</p>`;
    else if(k==='h')h+=`<h3>${a}</h3>`;
    else if(k==='svg')h+=`<figure class="fig">${a}<figcaption>${o||''}</figcaption></figure>`;
    else if(k==='tip')h+=`<div class="tip">💡 ${a}</div>`;
    else h+=`<div class="ex"><div class="bar"><span>範例</span><button class="cp">複製</button></div><pre>${esc(a)}</pre>${o?`<div class="out">${esc(o)}</div>`:''}</div>`;
  }
  const ex=EX[cur.id];
  if(ex)h+=`<div class="exq"><h3>✍️ 練習題</h3>${ex.map((e,k)=>`<p><b>題目 ${k+1}：</b>${esc(e[0])}</p><details><summary>查看參考解答</summary><div class="ex"><div class="bar"><span>參考解答</span><button class="cp">複製</button></div><pre>${esc(e[1])}</pre></div></details>`).join('')}</div>`;
  const qz=QZ[cur.id];
  if(qz)h+=`<div class="qz"><h3>🧠 小測驗</h3>${qz.map((q,k)=>`<div class="q" data-k="${k}"><p><b>${k+1}. </b>${esc(q[0])}</p>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div class="fb"></div></div>`).join('')}</div>`;
  h+=`<div class="my"><label class="done"><input type="checkbox" id="dn" ${dn[cur.id]?'checked':''}> 我已經讀完這一章</label><h3>📝 我的筆記</h3><textarea id="nt" placeholder="寫下這章的重點、疑問或心得（只儲存在這台裝置的瀏覽器）">${esc(S.get('note_'+cur.id,''))}</textarea></div>`;
  const pv=L[lang][i-1],nx=L[lang][i+1];
  h+=`<div class="pn"><span>${pv?`<a href="#${pv.id}">« 上一章</a>`:''}</span><span>${nx?`<a href="#${nx.id}">下一章 »</a>`:''}</span></div>`;
  $('#main').innerHTML=h;
  $('#dn').onchange=e=>{const d=S.get('done',{});d[cur.id]=e.target.checked;S.set('done',d);render()};
  $('#nt').oninput=e=>S.set('note_'+cur.id,e.target.value);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const qe=b.closest('.q'),q=qz[+qe.dataset.k],j=+b.dataset.j;qe.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===q[2])x.classList.add('ok');else if(n===j)x.classList.add('no')});qe.querySelector('.fb').textContent=(j===q[2]?'✅ 答對了！':'❌ 答錯了。')+q[3]});
  document.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.closest('.ex').querySelector('pre').textContent;
    try{navigator.clipboard.writeText(t);b.textContent='已複製 ✓'}catch(e){b.textContent='請手動複製'}
    setTimeout(()=>b.textContent='複製',1500);
  });
  $('#nav').classList.remove('open');
  document.title=cur.t+'｜程式學習筆記';
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
$('#q').oninput=render;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=L[b.dataset.l][0].id});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
$('#theme').onclick=()=>{
  const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()!=='#fff';
  r.dataset.theme=d?'light':'dark';
};
render();
</script>
</body>
</html>
